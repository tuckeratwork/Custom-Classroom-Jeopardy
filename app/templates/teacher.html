<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Teacher Jeopardy Board</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260817-buzzrules1">
  </head>
  <body data-role="teacher">
    <header class="topbar">
      <div>
        <p class="eyebrow">Teacher console</p>
        <h1 id="game-title">Classroom Jeopardy</h1>
      </div>
      <label class="audio-toggle"><input id="mute-music" type="checkbox"> Mute music</label>
      <div class="session-pill">Code <strong id="session-code">-----</strong></div>
    </header>

    <main class="layout">
      <section class="board-panel">
        <div class="actions">
          <button id="start-game" class="danger">Start New Game</button>
          <select id="config-path" aria-label="Game YAML file"></select>
          <label class="compact-field" for="team-count">Teams</label>
          <input id="team-count" type="number" min="2" max="10" value="2" aria-label="Number of teams">
          <button id="refresh-game" class="secondary">Refresh</button>
          <a id="presentation-link" class="button-link secondary" href="/board" target="_blank">Presentation</a>
        </div>
        <div id="team-name-fields" class="team-name-fields"></div>
        <div id="board" class="board" aria-live="polite"></div>
      </section>

      <aside class="control-panel">
        <section>
          <h2>Current clue</h2>
          <div id="current-clue" class="current-clue muted">No clue selected.</div>
          <div id="buzz-status" class="buzz-status"></div>
          <div id="rotation-status" class="rotation-status"></div>
          <label class="auto-random-toggle">
            <input id="auto-random-toggle" type="checkbox">
            Auto-random eligible student after 15 seconds
          </label>
          <label class="auto-random-toggle">
            <input id="early-buzz-toggle" type="checkbox">
            Early buzz penalty with 5-second opening countdown
          </label>
          <label class="auto-random-toggle">
            <input id="global-rotation-toggle" type="checkbox">
            All Participants Required for Buzzer Eligibility Reset
          </label>
          <label class="auto-random-toggle">
            <input id="show-eligible-toggle" type="checkbox">
            Show eligible students
          </label>
          <label class="auto-random-toggle">
            <input id="reactions-toggle" type="checkbox">
            Emoji reactions
          </label>
          <div id="buzz-timer" class="buzz-timer hidden">10</div>
          <div class="field-row">
            <label for="score-team">Team</label>
            <select id="score-team"></select>
          </div>
          <div id="daily-double-controls" class="field-row hidden">
            <label for="wager">Wager</label>
            <input id="wager" type="number" min="0" value="0">
            <button id="lock-daily-double" class="secondary">Lock wager</button>
          </div>
          <div class="button-row">
            <button id="score-correct">Correct</button>
            <button id="score-wrong" class="danger">Wrong</button>
            <button id="continue-clue" class="secondary">Continue</button>
            <button id="reset-buzzer" class="secondary">Reset buzzers</button>
            <button id="reset-rotation" class="secondary">Clear student rotation</button>
            <button id="random-buzz" class="secondary">Random eligible buzz</button>
          </div>
        </section>

        <section>
          <h2>Scores</h2>
          <div id="scores" class="scores"></div>
          <div class="button-row">
            <button id="save-scores" class="secondary">Save score changes</button>
          </div>
          <p id="score-save-status" class="save-status" aria-live="polite"></p>
        </section>

        <section>
          <h2>Final Jeopardy</h2>
          <div id="final-card" class="final-card"></div>
          <div id="final-wagers" class="final-wagers"></div>
          <div class="button-row">
            <button id="reset-final" class="secondary">Reset Final Jeopardy</button>
            <button id="calculate-winners">Calculate Final Scores</button>
            <button id="next-final-reveal" class="secondary">Reveal Next Place</button>
          </div>
        </section>

        <section>
          <h2>Students</h2>
          <div id="student-roster" class="student-roster"></div>
        </section>
      </aside>
    </main>
    <button id="return-top" class="return-top" type="button" aria-label="Return to top"></button>

    <script src="/static/teacher.js?v=20261027-finalautosubmit1"></script>
  </body>
</html>
