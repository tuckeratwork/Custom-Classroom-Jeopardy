<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jeopardy Buzzer</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260817-buzzrules1">
  </head>
  <body data-role="student">
    <main class="student-shell">
      <div id="reaction-stream-left" class="reaction-stream reaction-stream-left" aria-hidden="true"></div>
      <div id="reaction-stream-right" class="reaction-stream reaction-stream-right" aria-hidden="true"></div>
      <section id="join-card" class="join-card">
        <p class="eyebrow">Student buzzer</p>
        <h1>Join the game</h1>
        <label for="join-code">Session code</label>
        <input id="join-code" autocomplete="off" maxlength="8">
        <label for="team-name">Team name</label>
        <select id="team-name"></select>
        <label for="student-name">Your name</label>
        <input id="student-name" autocomplete="name">
        <button id="join-game">Join</button>
        <p id="join-error" class="error-text"></p>
      </section>

      <section id="buzzer-card" class="buzzer-card hidden">
        <p class="eyebrow" id="student-session"></p>
        <label class="audio-toggle student-audio-toggle"><input id="mute-music" type="checkbox"> Mute music</label>
        <h1 id="student-team"></h1>
        <div id="student-move-notice" class="notice-text hidden" aria-live="polite"></div>
        <div id="responder-banner" class="responder-banner hidden">You are up</div>
        <div id="student-clue" class="student-clue">Waiting for the teacher.</div>
        <div id="daily-double-action" class="final-action hidden"></div>
        <div id="buzzer-opening" class="buzzer-opening hidden" aria-live="polite"></div>
        <button id="buzz-button" class="buzz-button">BUZZ</button>
        <div id="buzz-timer" class="buzz-timer hidden">10</div>
        <p id="student-status" class="student-status"></p>
        <div id="remaining-teammates" class="remaining-teammates hidden"></div>
        <div id="reaction-controls" class="reaction-controls hidden"></div>
        <section id="student-final" class="student-final hidden">
          <div id="final-leaderboard" class="final-leaderboard"></div>
          <div id="final-action" class="final-action"></div>
        </section>
        <button id="change-game" class="secondary change-game">Change game</button>
        <div id="student-scores" class="scores"></div>
      </section>
    </main>

    <script src="/static/student.js?v=20260817-participant1"></script>
  </body>
</html>
