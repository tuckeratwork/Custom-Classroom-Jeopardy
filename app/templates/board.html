<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jeopardy Presentation Board</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260528-autopick1">
  </head>
  <body data-role="board">
    <main class="presentation-shell">
      <section class="presentation-scoreboard">
        <p class="eyebrow">Scoreboard</p>
        <h1 id="board-title">Classroom Jeopardy</h1>
        <div id="board-scores" class="presentation-scores"></div>
      </section>

      <section class="presentation-clue">
        <div id="presentation-board" class="presentation-board"></div>
        <div id="board-clue" class="presentation-clue-card">Waiting for the teacher.</div>
      </section>

      <section id="winner-reveal" class="winner-reveal hidden">
        <p class="eyebrow">Final Results</p>
        <div id="winner-stage"></div>
      </section>
    </main>

    <script src="/static/board.js?v=20260528-autopick1"></script>
  </body>
</html>
