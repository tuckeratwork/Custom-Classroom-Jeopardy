title: Cybersecurity Jeopardy
teams:
  - Red Team
  - Blue Team
  - Purple Team

categories:
  - name: Networking
    clues:
      - value: 100
        prompt: This protocol translates domain names into IP addresses.
        answer: DNS
      - value: 200
        prompt: This TCP flag begins the three-way handshake.
        answer: SYN
      - value: 300
        prompt: This tool is commonly used to inspect packets in a pcap file.
        answer: Wireshark
      - value: 400
        prompt: This private IPv4 range begins at 10.0.0.0.
        answer: 10.0.0.0/8
      - value: 500
        prompt: This attack floods a target with traffic to exhaust availability.
        answer: Denial of service or DDoS
  - name: Web Security
    clues:
      - value: 100
        prompt: This HTTP status code usually means "not found."
        answer: 404
      - value: 200
        prompt: This vulnerability injects script into pages viewed by other users.
        answer: Cross-site scripting or XSS
      - value: 300
        prompt: This cookie flag prevents JavaScript from reading a cookie.
        answer: HttpOnly
      - value: 400
        prompt: This attack tricks a logged-in browser into sending an unwanted request.
        answer: Cross-site request forgery or CSRF
      - value: 500
        prompt: This header helps control which sources can load scripts, images, and styles.
        answer: Content-Security-Policy or CSP
  - name: Crypto
    clues:
      - value: 100
        prompt: This process turns readable text into unreadable ciphertext.
        answer: Encryption
      - value: 200
        prompt: This one-way output verifies integrity but is not meant to be decrypted.
        answer: Hash
      - value: 300
        prompt: This symmetric cipher is widely used and standardized by NIST.
        answer: AES
      - value: 400
        prompt: This attack tries many possible passwords until one works.
        answer: Brute force
      - value: 500
        prompt: This value should be unique and unpredictable for many encryption modes.
        answer: Nonce or initialization vector
  - name: Linux
    clues:
      - value: 100
        prompt: This command lists files in a directory.
        answer: ls
      - value: 200
        prompt: This file stores local user account information.
        answer: /etc/passwd
      - value: 300
        prompt: This command changes file permissions.
        answer: chmod
      - value: 400
        prompt: This directory often stores system logs.
        answer: /var/log
      - value: 500
        prompt: This command shows listening network sockets and active connections.
        answer: ss or netstat
  - name: Incident Response
    clues:
      - value: 100
        prompt: This is the first step when you confirm an active compromise.
        answer: Containment
      - value: 200
        prompt: This timeline artifact records what happened and when.
        answer: Incident timeline
      - value: 300
        prompt: This type of indicator includes IPs, hashes, domains, and filenames.
        answer: Indicator of compromise or IOC
      - value: 400
        prompt: This post-incident meeting captures lessons learned.
        answer: Retrospective or postmortem
      - value: 500
        prompt: This practice preserves evidence integrity by documenting custody.
        answer: Chain of custody

final:
  category: Security Principles
  prompt: This principle says users and services should receive only the access required to do their job.
  answer: Least privilege
